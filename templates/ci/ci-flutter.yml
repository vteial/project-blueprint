name: Flutter CI

on:
  push:
    branches: [main, 'sprint-*/**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.kiro/**'
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          THRESHOLD=25
          TOTAL_LINES=$(grep -c "^" coverage/lcov.info || echo "0")
          COVERED=$(grep -c "^DA:.*[1-9]" coverage/lcov.info || echo "0")
          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$((COVERED * 100 / TOTAL_LINES))
          else
            COVERAGE=0
          fi
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${THRESHOLD}%"
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage ${COVERAGE}% below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage meets threshold"

      - name: Build web
        run: flutter build web --release

  integration-test:
    runs-on: ubuntu-latest
    needs: analyze-test-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run integration tests (headless)
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d chrome \
            --headless
